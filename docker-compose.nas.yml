# Deploy on the NAS with just this file — no source checkout needed.
# 1. docker login ghcr.io  (only required if the GitHub repo/package is private)
# 2. Edit the volume path below to point at the share you want scanned.
# 3. docker compose -f docker-compose.nas.yml up -d
services:
  nastree:
    image: ghcr.io/seraphofnineball/nastree:latest
    container_name: nastree
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SCAN_PATH: /data
      SCAN_INTERVAL: 6h
      RETAIN_SCANS: "5"
    volumes:
      - /path/to/your/nas/share:/data:ro
      - nastree-db:/db

volumes:
  nastree-db:
