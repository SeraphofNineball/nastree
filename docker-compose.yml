services:
  nastree:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nastree
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SCAN_PATH: /data
      SCAN_INTERVAL: 6h
      RETAIN_SCANS: "5"
    volumes:
      # Point this at the NAS share/path you want scanned. Read-only is enough.
      - /path/to/your/nas/share:/data:ro
      - nastree-db:/db

volumes:
  nastree-db:
